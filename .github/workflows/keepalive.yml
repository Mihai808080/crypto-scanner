name: keepalive

# GitHub dezactivează automat workflow-urile programate dintr-un repo public
# după 60 de zile fără activitate. Jobul ăsta face un commit gol o dată pe lună
# ca să nu se oprească niciodată scanner-ul.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit gol
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (menține cron-ul activ)"
          git push
