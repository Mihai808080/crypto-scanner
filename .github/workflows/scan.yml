name: crypto-scan

# Job LUNG cu buclă internă: o rulare ține ~5h45m și scanează la fiecare 5 min.
# Motivul: cron-ul GitHub pe */5 era executat în realitate o dată la 1-2 ore
# (întârzieri normale pe free tier), deci alertele veneau rar sau deloc.
# Cron-ul de aici doar pornește jobul; `concurrency` garantează că nu rulează
# două în paralel, iar o rulare programată în timp ce alta e activă așteaptă la
# coadă și pornește imediat ce prima iese → acoperire aproape continuă.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Trimite un mesaj de test pe Telegram"
        type: boolean
        default: false
      once:
        description: "O singură trecere (debug), nu buclă"
        type: boolean
        default: false

concurrency:
  group: crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h55m; scanner-ul iese singur la 5h45m (MAX_RUNTIME_SEC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restaurează starea anti-spam din ultima rulare (cheie cu prefix).
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: scan_state.json
          key: scan-state-${{ github.run_id }}
          restore-keys: |
            scan-state-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          RUN_ONCE: ${{ inputs.once && '1' || '' }}
          TEST_PING: ${{ inputs.test_ping }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ALERTS_URL: ${{ secrets.ALERTS_URL }}
          WATCHLIST_URL: ${{ secrets.WATCHLIST_URL }}
          ALERTS_KEY: ${{ secrets.ALERTS_KEY }}
          SIGNALS_URL: ${{ secrets.SIGNALS_URL }}
          # Forward test: scanam top-200 perps o data per bara de 4h si logam
          # ORICE semnal peste prag. ~4.5/zi => ~400 tranzactii in ~3 luni,
          # minimul ca sa distingi edge de zgomot. Telegram primeste doar top 3
          # per bara; jurnalul le primeste pe toate.
          UNIVERSE_SIZE: "200"
          TG_MAX_PER_BAR: "3"
          MIN_SCORE: "80"
          SCAN_INTERVAL_SEC: "300"
          MAX_RUNTIME_SEC: "20700"   # 5h45m
          SFP_SYMBOLS: "DOGEUSDT,SOLUSDT"
        run: python scanner.py
