name: probe-endpoints

# Temporar, manual. Măsoară din runner ce burse răspund — nu se poate deduce
# de pe alt IP (Binance dă 451 doar de aici). Se șterge după ce alegem sursa.
on:
  workflow_dispatch:
    inputs:
      which:
        description: "endpoints = ce răspunde · history = cât de înapoi"
        type: choice
        options: [endpoints, history]
        default: endpoints

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/probe_${{ inputs.which == 'history' && 'history' || 'endpoints' }}.py
